name: Gabarito+ Practice UI 3.4

on:
  push:
    branches: [main]
    paths:
      - 'tools/build-practice-standalone-v34.py'
      - '.github/workflows/build-practice-ui-v34.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gerar treino stored-only
        run: python tools/build-practice-standalone-v34.py
      - name: Validar JavaScript
        run: node --check js/practice-standalone-v34.js
      - name: Publicar arquivo gerado
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/practice-standalone-v34.js
          if git diff --cached --quiet; then
            echo 'Sem alterações.'
          else
            git commit -m 'feat: gera treino standalone 3.4 stored-only [skip ci]'
            git push
          fi
