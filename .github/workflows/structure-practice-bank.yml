name: Gabarito+ Structured Practice Bank

on:
  push:
    branches: [main]
    paths:
      - 'tools/structure-practice-bank.py'
      - 'tools/structure-practice-bank-v2.py'
      - 'tools/structure-practice-bank-v3.py'
      - 'tools/curate-practice-bank-v4.py'
      - '.github/workflows/structure-practice-bank.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  structure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependências de extração
        run: python -m pip install --disable-pip-version-check pymupdf==1.26.4 pillow==11.3.0 requests==2.32.5

      - name: Estruturar questões publicadas
        run: python tools/structure-practice-bank-v3.py

      - name: Curar e escolher conteúdo de alta confiança
        run: python tools/curate-practice-bank-v4.py

      - name: Mostrar cobertura final
        run: |
          cat generated/practice-structured/report.json
          cat generated/practice-curated-v4/report.json

      - name: Salvar conteúdo estruturado e ativos individuais
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add generated/practice-structured generated/practice-curated-v4 assets/practice/structured
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração gerada.'
          else
            git commit -m 'data: publica banco de treino curado v4 [skip ci]'
            git push
          fi
